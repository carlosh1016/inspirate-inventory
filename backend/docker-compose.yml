services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: inspirate
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: inspirate_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspirate -d inspirate_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
