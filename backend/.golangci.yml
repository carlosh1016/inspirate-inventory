run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocyclo
    - gocritic

linters-settings:
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/carlosh1016/inspirate-inventory/backend
  misspell:
    # This codebase is in Spanish; these words are correct Spanish that
    # misspell's English dictionary otherwise flags as typos of English
    # words (variantes/variante -> "variants"/"variant", producto ->
    # "production", inventario -> "inventor", correccion -> "correction").
    ignore-words:
      - variantes
      - variante
      - producto
      - productos
      - inventario
      - correccion

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
